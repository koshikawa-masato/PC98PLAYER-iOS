name: Feedback authentication
on:
  pull_request:
    paths:
      - 'server/feedback/**'
      - '.github/workflows/feedback.yml'
  push:
    branches: [main]
    paths:
      - 'server/feedback/**'
      - '.github/workflows/feedback.yml'
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/feedback
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/feedback/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:runtime
